<style>

@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mut:#98989f;--sep:rgba(84,84,88,.55);--fill:#2c2c2e;--ac:#0a84ff;--sh:none;--bar:rgba(22,22,24,.82);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;overflow-y:auto;padding:10px 18px 28px}
.h0{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.ttl{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--mut);font-size:14px}
.ic{display:flex;gap:10px}
.ic button{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}
.sec b{font-size:19px;letter-spacing:-.015em}
.sec button{border:0;background:none;color:var(--ac);font-size:15px;padding:0}
.qas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{background:var(--card);box-shadow:var(--sh);border:0;border-radius:16px;padding:13px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.qa .tile{width:38px;height:38px;border-radius:11px}.qa .tile svg{width:20px;height:20px}
.qa:active,.it:active,.sc:active{transform:scale(.98)}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px;box-shadow:var(--sh);margin-bottom:12px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:8px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--fill);color:var(--tx);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);box-shadow:var(--sh);border:0;border-radius:16px;padding:14px;text-align:left;display:block;width:100%}
.sl{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scroll-snap-type:x proximity;scroll-padding-left:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.gc{flex:none;width:136px;height:80px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:13px 14px;font-size:15px;font-weight:600;scroll-snap-align:start}
.gc i{width:14px;height:14px;border-radius:4px;flex:none}.gc span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl i{width:11px;height:11px;border-radius:3px;flex:none}
.sl span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl em{font-style:normal;letter-spacing:1px;font-weight:700}
.sv{font-size:24px;font-weight:700;margin-top:12px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv small{font-size:13px;font-weight:500;color:var(--mut)}
.it{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);box-shadow:var(--sh);border:0;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tile{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.tile svg{width:22px;height:22px}
.tile.lg{width:64px;height:64px;border-radius:17px}.tile.lg svg{width:32px;height:32px}
.bd{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:none;max-width:38%}
.cd{font-weight:700;font-size:15px}
.big{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:6px 0 14px}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;background:var(--card);box-shadow:var(--sh);padding:7px 15px;border-radius:99px;font-size:14px}
.pill.on{background:var(--ac);color:#fff}
nav{flex:none;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:7px 0 calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:25px;height:25px}
nav button.on{color:var(--ac)}
.ov{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 30px;transform:translateX(100%);visibility:hidden;transition:transform .34s cubic-bezier(.32,.72,0,1),visibility 0s .34s}
.ov.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.32,.72,0,1)}
#sheet{z-index:6}#srch{z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:44px}
.top b{font-size:17px;font-weight:600}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:20px;color:var(--tx)}
.rb svg{width:18px;height:18px}
.lnk{border:0;background:none;color:var(--ac);font-size:16px;padding:8px 0}
.sb{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:40px;flex:1}
.sb svg{width:17px;height:17px;color:var(--mut);flex:none}
.sb input{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;min-width:0}
.dt{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:14px 2px 4px}
.code{display:flex;align-items:center;gap:10px;margin:12px 2px 16px;font-size:26px;font-weight:700}
.chip{font-size:12px;font-weight:600;color:var(--ac);background:var(--fill);border-radius:8px;padding:3px 8px}
.acts{display:flex;gap:10px}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--sh)}.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.b1,.b2{flex:1;text-align:center;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:16px}
.b1{background:var(--ac);color:#fff}.b2{background:var(--fill);color:var(--tx)}
.hd{color:var(--mut);font-size:13px;margin:24px 4px 8px}
.grp{background:var(--card);box-shadow:var(--sh);border-radius:16px;overflow:hidden}
.pad{padding:14px 16px;line-height:1.5}
.btn{display:block;text-align:center;border:0;border-radius:14px;padding:15px;font-weight:600;width:100%;margin-top:16px;background:var(--ac);color:#fff}
.btn.s{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
textarea{width:100%;border:0;background:none;padding:14px 16px;color:var(--tx);font:inherit;outline:0;resize:none;min-height:110px;display:block}
.frm{display:flex;align-items:center;padding:0 16px;min-height:48px;position:relative}
.frm+.frm::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.frm label{width:92px;flex:none}
.frm input,.frm select{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;text-align:right;padding:13px 0;min-width:0}
.foot{color:var(--mut);font-size:13px;padding:8px 4px 0;line-height:1.5}
code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:44px 0}
#toast{position:absolute;left:24px;right:24px;bottom:90px;background:rgba(40,40,42,.95);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;display:none;z-index:9;text-align:center}
</style>
</head>

function tile(sis,lg,ic,col){var n=String(sis||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""),g=P.def,c="#8e8e93";
if(/hidr|hydr/.test(n)){g=P.hid;c="#0a7aff"}else if(/bater|batt|bms|lith|litio/.test(n)){g=P.bat;c="#30b94d"}else if(/motor|drive|trac/.test(n)){g=P.mot;c="#ff9500"}else if(/trav|brak|frei/.test(n)){g=P.tra;c="#ff3b30"}else if(/elet|elec|can|comm|sensor/.test(n)){g=P.ele;c="#af52de"}

}else{

h='<div class="big">'+T+'</div><div class="pills"><button class="pill'+(!gf?" on":"")+'" data-b="">All</button>'+(gf&&gf.f==="sistema"?'<button class="pill on" data-b="">'+esc(gf.v)+' ✕</button>':'')+bs.map(function(b){return '<button class="pill'+(gf&&gf.f==="marca"&&gf.v===b?" on":"")+'" data-b="'+esc(b)+'">'+esc(b)+'</button>'}).join("")+'</div>'+
list(l,S.v==="fav"?"No favorites yet":S.v==="man"?"No manual links yet.<br>Add a URL in the link column.":S.v==="vid"?"No videos yet.<br>Add a URL in the video column.":"No errors",S.v==="vid"?vitem:item)+'<div class="foot" style="text-align:center">'+l.length+(l.length===1?" entry":" entries")+'</div>'}
m.innerHTML=h;m.scrollTop=keep?st:0;
if(S.v==="set"){
var mp={ci:"id",ck:"key",ct:"tab",cx:"px"};Object.keys(mp).forEach(function(i){el(i).oninput=function(){S.cfg[mp[i]]=this.value.trim();save()}});
el("cr").onchange=function(){S.cfg.reg=this.value;save()};
el("im").onclick=function(){var d=parseAny(el("pt").value);if(!d.length){toast("No rows with a codigo column found");return}S.D=d;S.st="Imported "+d.length+" errors.";save();render();toast(S.st)};
el("ex").onclick=function(){S.D=parseAny(SAMPLE);save();render();toast("Sample data restored")}}}
function sync(){var c=S.cfg;
if(!c.id||!c.key||!c.tab){toast("Fill in App ID, access key and table in Settings");return}
function say(t,ok){S.st=t;save();var e=el("st");if(e)e.textContent=t;toast(t);if(ok)render(1)}
toast("Syncing…");
var base=c.px?c.px.replace(/\/+$/,""):"https://"+c.reg;
fetch(base+"/api/v2/apps/"+encodeURIComponent(c.id)+"/tables/"+encodeURIComponent(c.tab)+"/Action",{method:"POST",headers:{"Content-Type":"application/json","ApplicationAccessKey":c.key},body:JSON.stringify({Action:"Find",Properties:{},Rows:[]})})
.then(function(r){return r.text().then(function(t){return{ok:r.ok,s:r.status,t:t}})})
.then(function(o){
if(!o.ok){say("AppSheet error "+o.s+": "+o.t.slice(0,140));return}
if(!o.t.trim()){say("Empty response. Check that the API is enabled, the key and the table name.");return}
var j;try{j=JSON.parse(o.t)}catch(e){say("Unexpected response: "+o.t.slice(0,100));return}
var d=fromObjs(Array.isArray(j)?j:(j.Rows||[]));
if(!d.length){say("Connected, but no rows with a codigo column were found.");return}
S.D=d;say("Synced "+d.length+" errors at "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),1)})
.catch(function(){say("No response. If you are online, the browser blocked the request (CORS): set up the Proxy.")})}
function host(u){return u.replace(/^https?:\/\/(www\.)?/,"").split(/[\/?#]/)[0]}
function embed(u){var m;
if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/))return '<iframe src="https://www.youtube.com/embed/'+m[1]+'" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>';
if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return '<iframe src="https://player.vimeo.com/video/'+m[1]+'" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return '<iframe src="https://drive.google.com/file/d/'+m[1]+'/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>';
if(/\.(mp4|webm|mov)(\?|#|$)/i.test(u))return '<video src="'+esc(u)+'" controls playsinline preload="metadata"></video>';
return ""}
function lrow(u,ic,col,t){return '<a class="it" target="_blank" rel="noopener" href="'+esc(u)+'" style="margin:0">'+tile("",0,ic,col)+'<div class="bd"><div class="t">'+esc(t)+'</div><div class="m">'+esc(host(u))+'</div></div><span class="cd" style="color:var(--ac)">Open</span></a>'}
function open(k){
var e=S.D.filter(function(x){return key(x)===k})[0];if(!e)return;
var sh=el("sheet");
function sec(t,b){return b?'<div class="hd">'+t+'</div><div class="grp pad">'+esc(b)+'</div>':''}
var man=url(e.link)?'<div class="hd">Manual</div>'+lrow(e.link,P.man,"#0a7aff",e.manual||"Open manual"):sec("Manual",e.manual),
em=url(e.video)?embed(e.video):"",
vd=url(e.video)?'<div class="hd">Video</div>'+(em?'<div class="vid">'+em+'</div><div class="foot"><a href="'+esc(e.video)+'" target="_blank" rel="noopener" style="color:var(--ac)">Open in new tab</a></div>':lrow(e.video,P.vid,"#ff3b30","Watch video")):"";
sh.innerHTML='<div class="top"><button class="rb" id="bk" aria-label="Back">'+P.back+'</button><b>Error details</b><button class="rb" id="fv" aria-label="Favorite"></button></div>'+
tile(e.sistema,1)+'<div class="dt">'+esc(e.titulo||e.codigo)+'</div><div class="sub">'+esc(e.marca)+' · '+esc(e.modelo)+'</div>'+
'<div class="code">'+esc(e.codigo)+(e.sistema?'<span class="chip">'+esc(e.sistema)+'</span>':'')+'</div>'+
'<div class="hd" style="margin-top:4px">Overview</div><div class="grid">'+stat("Brand",e.marca||"—","#0a7aff")+stat("Model",e.modelo||"—","#ff9500")+stat("System",e.sistema||"—","#30b94d")+stat("Code",e.codigo,"#ff3b30")+'</div>'+
sec("Probable cause",e.causa)+sec("Solution",e.solucao)+man+vd;
function heart(){var f=el("fv");f.textContent=S.fav[k]?"♥":"♡";f.style.color=S.fav[k]?"#ff3b30":""}
heart();sh.scrollTop=0;sh.classList.add("open");
el("bk").onclick=function(){sh.classList.remove("open");setTimeout(function(){if(!sh.classList.contains("open"))sh.innerHTML=""},400);if(!el("srch").classList.contains("open"))render(1)};
el("fv").onclick=function(){S.fav[k]=!S.fav[k];if(!S.fav[k])delete S.fav[k];save();heart()}}
function openSearch(){var o=el("srch");o.classList.add("open");el("sq").value="";el("sr").innerHTML='<div class="empty">Type a code, brand or model</div>';setTimeout(function(){el("sq").focus()},60)}
el("sq").oninput=function(){var q=this.value.toLowerCase().trim();
el("sr").innerHTML=q?list(S.D.filter(function(e){return [e.codigo,e.titulo,e.marca,e.modelo,e.sistema,e.causa].join(" ").toLowerCase().indexOf(q)>-1}),"No results"):'<div class="empty">Type a code, brand or model</div>'};
el("sc").onclick=function(){el("srch").classList.remove("open");el("sq").blur()};
document.addEventListener("click",function(ev){var t=ev.target,x;
if(t.closest("a[href]"))return;
if(x=t.closest("[data-k]")){open(x.dataset.k)}
else if(x=t.closest("[data-v]")){S.v=x.dataset.v;S.gf=null;render()}
else if(x=t.closest("[data-q]")){var q=x.dataset.q;if(q==="syn")sync();else{S.v=q;S.gf=null;render()}}
else if(x=t.closest("[data-g]")){var p=x.dataset.g.split("|");S.v="err";S.gf={f:p[0],v:p.slice(1).join("|")};render()}
else if(x=t.closest("[data-s]")){S.ov=x.dataset.s;render(1)}
else if(x=t.closest("[data-b]")){var b=x.dataset.b;S.gf=b?{f:"marca",v:b}:null;render(1)}
else if(x=t.closest("[data-a]")){if(x.dataset.a==="search")openSearch();else sync()}});
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
