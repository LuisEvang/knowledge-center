<style>

html,body{height:100%;margin:0}

.h0{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}

.qa:active,.it:active,.sc:active{transform:scale(.98)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--card);border-radius:10px;padding:3px;box-shadow:var(--sh);margin-bottom:12px}.seg::-webkit-scrollbar{display:none}

.ut{display:flex;align-items:center;justify-content:space-between}.ut em{font-style:normal;font-size:12px;color:var(--mut)}
.ch{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:3px 8px}
.uh{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc{flex:none;width:158px;height:62px;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 14px;scroll-snap-align:start}
.gt{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}

.bd{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cd{font-weight:700;font-size:15px}
.big{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:6px 0 14px}

.pill.on{background:var(--ac);color:#fff}

.ov{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 30px;transform:translateX(100%);visibility:hidden;transition:transform .34s cubic-bezier(.32,.72,0,1),visibility 0s .34s}
.ov.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.32,.72,0,1)}
#sheet{z-index:6}#srch{z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:44px}

.rb{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:20px;color:var(--tx)}

.sb{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:40px;flex:1}

.sb input{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;min-width:0}
.dt{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:14px 2px 4px}
.code{display:flex;align-items:center;gap:10px;margin:12px 2px 16px;font-size:26px;font-weight:700}
.chip{font-size:12px;font-weight:600;color:var(--ac);background:var(--fill);border-radius:8px;padding:3px 8px}
.acts{display:flex;gap:10px}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--sh)}.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.b1,.b2{flex:1;text-align:center;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:16px}
.b1{background:var(--ac);color:#fff}.b2{background:var(--fill);color:var(--tx)}
.hd{color:var(--mut);font-size:13px;margin:24px 4px 8px}
.grp{background:var(--card);box-shadow:var(--sh);border-radius:16px;overflow:hidden}
.pad{padding:14px 16px;line-height:1.5}
.btn{display:block;text-align:center;border:0;border-radius:14px;padding:15px;font-weight:600;width:100%;margin-top:16px;background:var(--ac);color:#fff}
.btn.s{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
textarea{width:100%;border:0;background:none;padding:14px 16px;color:var(--tx);font:inherit;outline:0;resize:none;min-height:110px;display:block}
.frm{display:flex;align-items:center;padding:0 16px;min-height:48px;position:relative}
.frm+.frm::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.frm label{width:92px;flex:none}
.frm input,.frm select{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;text-align:right;padding:13px 0;min-width:0}
.foot{color:var(--mut);font-size:13px;padding:8px 4px 0;line-height:1.5}
code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:44px 0}
#toast{position:absolute;left:24px;right:24px;bottom:90px;background:rgba(40,40,42,.95);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;display:none;z-index:9;text-align:center}
</style>
</head>
<body>

<main id="main"></main>

</div>
<script>
var G=function(d,x){return '<svg viewBox="0 0 24 24" fill="'+(x?"currentColor":"none")+'" stroke="'+(x?"none":"currentColor")+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>'};
var P={
home:G('<path d="M4 11 12 4l8 7v8.500a1 1 0 0 1-1 1h-4.500v-6h-5v6H5a1 1 0 0 1-1-1z"/>'),

vid:G('<path d="M8 5.500v13l11-6.500z"/>',1),
back:G('<path d="M15 5 8 12l7 7"/>'),

ele:G('<path d="M13.500 2 5 13.500h6L10 22l9-12h-6z"/>',1),
def:G('<path d="M14.700 6.300a4 4 0 0 0-5 5L3 18l3 3 6.700-6.700a4 4 0 0 0 5-5l-2.400 2.400-2.300-.7-.7-2.300z"/>',1)};
function tile(sis,lg,ic,col){var n=String(sis||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""),g=P.def,c="#8e8e93";
if(/hidr|hydr/.test(n)){g=P.hid;c="#0a7aff"}else if(/bater|batt|bms|lith|litio/.test(n)){g=P.bat;c="#30b94d"}else if(/motor|drive|trac/.test(n)){g=P.mot;c="#ff9500"}else if(/trav|brak|frei/.test(n)){g=P.tra;c="#ff3b30"}else if(/elet|elec|can|comm|sensor/.test(n)){g=P.ele;c="#af52de"}
if(ic){g=ic;c=col}
return '<span class="tile'+(lg?" lg":"")+'" style="background:'+c+'">'+g+'</span>'}
var SAMPLE="marca,modelo,codigo,sistema,titulo,causa,solucao,manual,link,video\nToyota,8FBE15,E204,Battery,Battery voltage out of range,Loose connection or failing cell,Check cell voltage; tighten terminals,Service manual p.87,,\nLinde,E20,F305,Motor,Traction motor overheating,Blocked ventilation or faulty sensor,Clean ventilation; test sensor,Repair manual p.140,,\nJungheinrich,EFG 216,E101,Hydraulic,Low hydraulic pressure,Low oil or clogged filter,Check level; replace filter,Service manual p.112,,";
var K=["marca","modelo","codigo","sistema","titulo","causa","solucao","manual","link","video","data","paginas"];
var S={v:"home",gf:null,ov:"b",D:[],M:[],U:[],fav:{},notes:{},cfg:{id:"e6df2f4b-2f62-4667-af64-78f66f316ce8",key:"",tab:"Table 1",tab2:"",tab3:"",reg:"www.appsheet.com",px:""},st:""};
function el(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function url(s){return/^https?:\/\//.test(s)}
function fromObjs(a){return a.map(function(r,n){var o={id:n},m={};Object.keys(r).forEach(function(k){m[norm(k)]=r[k]});K.forEach(function(k){o[k]=m[k]==null?"":String(m[k]).trim()});if(!o.data)o.data=String(m.date||"").trim();if(!o.paginas)o.paginas=String(m.pages||m.numerodepaginas||m.npaginas||"").trim();return o}).filter(function(o){return o.codigo})}
function fromObjsM(a){return a.map(function(r){var m={},o={};Object.keys(r).forEach(function(k){m[norm(k)]=r[k]});["marca","modelo","titulo","categoria","link","data","paginas"].forEach(function(k){o[k]=m[k]==null?"":String(m[k]).trim()});if(!o.data)o.data=String(m.date||"").trim();if(!o.paginas)o.paginas=String(m.pages||m.numerodepaginas||m.npaginas||"").trim();return o}).filter(function(o){return o.titulo||url(o.link)})}
function fromObjsU(a){return a.map(function(r){var m={},o={};Object.keys(r).forEach(function(k){m[norm(k)]=r[k]});["titulo","tipo","marca","modelo","data","mensagem","link"].forEach(function(k){o[k]=m[k]==null?"":String(m[k]).trim()});if(!o.mensagem)o.mensagem=String(m.descricao||m.message||m.description||m.texto||"").trim();if(!o.tipo)o.tipo=String(m.type||m.categoria||"").trim();if(!o.data)o.data=String(m.date||"").trim();return o}).filter(function(o){return o.titulo||o.mensagem})}
function parseCSV(t){var d=t.split("\n")[0].indexOf("\t")>-1?"\t":",",r=[],row=[],f="",q=false,i,c;
for(i=0;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){row.push(f);f=""}else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}
row.push(f);r.push(row);r=r.filter(function(x){return x.join("").trim()});if(r.length<2)return[];

function save(){try{localStorage.setItem("kcA",JSON.stringify({D:S.D,M:S.M,U:S.U,fav:S.fav,notes:S.notes,cfg:S.cfg,st:S.st}))}catch(e){}}
try{var s=JSON.parse(localStorage.getItem("kcA")||"null");if(s){S.D=s.D||[];S.M=s.M||[];S.U=s.U||[];S.fav=s.fav||{};S.notes=s.notes||{};S.cfg=Object.assign(S.cfg,s.cfg||{});S.st=s.st||""}}catch(e){}

}else if(S.v==="man"){

function api(tab){var c=S.cfg,base=c.px?c.px.replace(/\/+$/,""):"https://"+c.reg;

toast("Syncing…");
api(c.tab).then(function(rows){var d=fromObjs(rows);if(!d.length)throw new Error("Connected, but no rows with a codigo column were found.");S.D=d;return c.tab2?api(c.tab2).then(function(r){S.M=fromObjsM(r)}):0})
.then(function(){return c.tab3?api(c.tab3).then(function(r){S.U=fromObjsU(r)}):0})
.then(function(){say("Synced "+S.D.length+" errors"+(c.tab2?", "+S.M.length+" manuals":"")+(c.tab3?", "+S.U.length+" updates":"")+" at "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),1)})
.catch(function(e){say(e.message)})}
function host(u){return u.replace(/^https?:\/\/(www\.)?/,"").split(/[\/?#]/)[0]}
function embed(u){var m;
if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/))return '<iframe src="https://www.youtube.com/embed/'+m[1]+'" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>';
if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return '<iframe src="https://player.vimeo.com/video/'+m[1]+'" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return '<iframe src="https://drive.google.com/file/d/'+m[1]+'/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>';
if(/\.(mp4|webm|mov)(\?|#|$)/i.test(u))return '<video src="'+esc(u)+'" controls playsinline preload="metadata"></video>';
return ""}

tile(e.sistema,1)+'<div class="dt">'+esc(e.titulo||e.codigo)+'</div><div class="sub">'+esc(e.marca)+' · '+esc(e.modelo)+'</div>'+
